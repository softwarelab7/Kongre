  <link
    href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;700;900&family=Roboto:wght@400;700&family=Lato:wght@400;700&family=Montserrat:wght@400;700&family=Open+Sans:wght@400;700&family=Poppins:wght@400;700&family=Merriweather:wght@400;700&family=Playfair+Display:wght@400;700&display=swap"
    rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            primary: "rgb(var(--color-primary) / <alpha-value>)",
            "background-light": "#f6f6f8",
            "background-dark": "#101722"
          },
          fontFamily: {
            display: "Sora, sans-serif",
            sans: "Roboto, sans-serif"
          }
        }
      }
    }
  </script>
  <style>
    :root {
      --color-primary: 37 99 235;
      /* Initial Blue */
    }

    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 4px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #94a3b8;
    }

    .dark ::-webkit-scrollbar-thumb {
      background: #334155;
    }

    .dark ::-webkit-scrollbar-thumb:hover {
      background: #475569;
    }

    /* Hide Number Input Arrows */
    input[type=number]::-webkit-inner-spin-button,
    input[type=number]::-webkit-outer-spin-button {
      -webkit-appearance: none;
      appearance: none;
      margin: 0;
    }

    input[type=number] {
      -moz-appearance: textfield;
      appearance: textfield;
    }

    /* ===== PRINT STYLES ===== */
    @media print {
      * {
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
      }

      /* Hide UI */
      header, .print\:hidden, [class*="print:hidden"], .no-print,
      [class*="sticky"], .fixed {
        display: none !important;
      }

      html, body {
        margin: 0 !important;
        padding: 0 !important;
        background: white !important;
        height: 100% !important;
        overflow: hidden !important;
      }

      /* Flatten wrappers */
      #root, #root > div, #root > div > div,
      #root > div > main, #root > div > div > main {
        display: block !important;
        overflow: visible !important;
        padding: 0 !important;
        margin: 0 !important;
        height: auto !important;
        max-width: none !important;
        background: transparent !important;
        box-shadow: none !important;
        border: none !important;
      }

      #pdf-content {
        width: 816px !important;
        min-height: 0 !important;
        margin: 0 !important;
        padding: 0 !important;
        box-shadow: none !important;
        background: white !important;
        /* zoom is set by JavaScript — do NOT override here */
      }

      #pdf-content input[type="text"],
      #pdf-content textarea {
        border: none !important;
        background: transparent !important;
        box-shadow: none !important;
      }

      @page {
        size: letter portrait;
        margin: 0;
      }
    }
  </style>
